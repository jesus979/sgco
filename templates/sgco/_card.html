<a href="{% url url_name %}" class="block bg-white border border-base-200 rounded-lg p-5 hover:shadow-md transition">
  <div class="flex items-center gap-3">
    <div class="rounded bg-primary-100 text-primary-700 p-2">
      <i class="ti ti-{{ icon }} text-2xl"></i>
    </div>
    <div>
      <h3 class="font-semibold text-base-900">{{ title }}</h3>
      <p class="text-sm text-base-500">{{ description }}</p>
    </div>
  </div>
</a>
