{% load sgco_extras %}
<div class="bg-white border border-base-200 rounded-lg p-6">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label class="block text-sm font-medium text-base-700 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<p class="text-xs text-base-400 mt-1">{{ field.help_text }}</p>{% endif %}
        {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors|join:', ' }}</p>{% endif %}
      </div>
    {% endfor %}
    <div class="flex gap-2">
      <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded hover:bg-primary-700">
        {% if is_update %}Actualizar{% else %}Crear{% endif %}
      </button>
      <a href="javascript:history.back()" class="px-4 py-2 border border-base-200 rounded">Cancelar</a>
    </div>
  </form>
</div>
